<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codebase-trends</title>
<!-- Same as page.html's: a theme picked with the button applies before the first paint. -->
<script>try { const t = localStorage.getItem('codebase-trends:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<main class="wrap">
  <p class="sub">Loading…</p>
</main>
<!-- build.ts fills the empty import map: each module's .ts import loads its built .js, stamped with its content hash. -->
<script type="importmap">{"imports":{}}</script>
<script type="module">import './app/app.ts';</script>
</body>
</html>
