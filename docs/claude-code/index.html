<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code · codebase-trends</title>
<!-- A theme picked with the button (app.js) applies before the first paint; without one, the OS decides. -->
<script>try { const t = localStorage.getItem('codebase-trends:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="../app.css?v=0dec6c74">
</head>
<body data-project="claude-code" data-basis="changelog">
<main class="wrap">
  <p class="crumb">codebase-trends / <select id="switch" aria-label="Project"><option>Claude Code</option></select><button id="theme" class="btn theme" type="button"></button></p>
  <header class="head">
    <h1>Claude Code</h1>
    <p id="meta" class="meta"></p>
  </header>
  <section class="kpi-block">
    <div id="kpis" class="kpis"></div>
  </section>
  <section class="panel">
    <h2 id="title"></h2>
    <p id="subtitle" class="sub"></p>
    <div id="legend" class="legend"></div>
    <div class="chart-scroll"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>
    <div id="chips" class="chips"></div>
    <ol class="notes">
      <li id="fn-counted"></li>
      <li id="fn-window"></li>
      <li id="fn-fix"></li>
      <li id="fn-lines"></li>
    </ol>
  </section>
  <section id="drill" class="panel" hidden>
    <div class="panel-head">
      <h2 id="drill-title"></h2>
      <button id="drill-close" class="btn" type="button">Close</button>
    </div>
    <div id="drill-list" class="drill-list"></div>
    <p id="drill-empty" class="sub" hidden></p>
  </section>
</main>
<script src="../vendor/chart.umd.js?v=ecc3cd1e"></script>
<script src="../app.js?v=f7c11d0c" defer></script>
</body>
</html>
