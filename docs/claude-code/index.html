<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code · codebase-trends</title>
<link rel="stylesheet" href="../app.css">
</head>
<body data-project="claude-code" data-basis="changelog">
<main class="wrap">
  <p class="crumb">codebase-trends / <select id="switch" aria-label="Project"><option>Claude Code</option></select></p>
  <header class="head">
    <h1>Claude Code</h1>
    <p id="meta" class="meta"></p>
  </header>
  <section class="kpi-block">
    <div id="kpis" class="kpis"></div>
  </section>
  <section class="panel">
    <h2 id="title"></h2>
    <p id="subtitle" class="sub"></p>
    <div id="legend" class="legend"></div>
    <div class="chart-scroll"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>
    <div id="chips" class="chips"></div>
    <ol class="notes">
      <li id="fn-window"></li>
      <li id="fn-fix"></li>
      <li id="fn-markers">Model release dates are reference markers; proximity does not establish causation.</li>
    </ol>
  </section>
  <section id="drill" class="panel" hidden>
    <div class="panel-head">
      <h2 id="drill-title"></h2>
      <button id="drill-close" class="btn" type="button">Close</button>
    </div>
    <table id="drill-table">
      <thead><tr><th>Version</th><th>Type</th><th>Source</th><th>Change</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="drill-empty" class="sub" hidden>No events in this period.</p>
  </section>
</main>
<script src="../vendor/chart.umd.js"></script>
<script src="../app.js" defer></script>
</body>
</html>
